name: ALPNAI payment reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'

permissions:
  contents: read

concurrency:
  group: alpnai-payment-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'fredericmagnathy-ops/alpnai-agent-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-09-14
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7, verified 2026-09-14
        with:
          python-version: '3.13'
      - name: Recheck existing orders without submitting payments
        id: probe
        continue-on-error: true
        env:
          ALPNAI_BASE_URL: 'https://alpnai.com'
          ALPNAI_MONITOR_TOKEN: ${{ secrets.ALPNAI_MONITOR_TOKEN }}
          ALPNAI_SITES_BYPASS: ${{ secrets.ALPNAI_SITES_BYPASS }}
        run: python scripts/check_cloud.py reconcile --report reports/payment-reconciliation.json
      - name: Write aggregate reconciliation summary
        if: always()
        run: python scripts/check_cloud.py summary --report reports/payment-reconciliation.json
      - name: Preserve minimal report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, verified 2026-09-14
        with:
          name: payment-reconciliation-${{ github.run_id }}
          path: reports/payment-reconciliation.json
          retention-days: 7
          if-no-files-found: error
      - name: Fail the run when reconciliation could not be checked
        if: always() && steps.probe.outcome != 'success'
        run: exit 1
